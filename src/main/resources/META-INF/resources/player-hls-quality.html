<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
</head>
<body>

<video id="video" controls width="1280" height="720" autoplay></video>

<div>
    <label for="quality">Quality:</label>
    <select id="quality">
        <option value="-1">Auto</option>
    </select>
</div>

<script>
    const video = document.getElementById('video');
    const qualitySelect = document.getElementById('quality');

    const src = "/api/videos/123/hls/master.m3u8";

    if (Hls.isSupported()) {

        const hls = new Hls({
            debug: true
        });

        hls.loadSource(src);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {

            console.log("Manifest parsed OK");
            console.log("Available levels:", hls.levels);

            // Add available qualities
            hls.levels.forEach((level, index) => {

                const option = document.createElement("option");

                option.value = index;
                option.textContent = level.height + "p";

                qualitySelect.appendChild(option);
            });

        });

        // User changes quality
        qualitySelect.addEventListener("change", () => {
    const level = parseInt(qualitySelect.value);

    const currentTime = video.currentTime;
    const wasPlaying = !video.paused;

    video.pause();

    hls.currentLevel = level;

    const onLevelSwitched = () => {
        video.currentTime = currentTime;

        if (wasPlaying) {
            video.play().catch(error => {
                console.error("Unable to resume playback:", error);
            });
        }

        hls.off(Hls.Events.LEVEL_SWITCHED, onLevelSwitched);
    };

    hls.on(Hls.Events.LEVEL_SWITCHED, onLevelSwitched);
});

        hls.on(Hls.Events.LEVEL_SWITCHED, (event, data) => {

            const level = hls.levels[data.level];

            console.log(
                "Playing:",
                level.height + "p"
            );
        });

        hls.on(Hls.Events.ERROR, (event, data) => {

            console.error(
                "HLS ERROR:",
                data.type,
                data.details,
                "fatal:",
                data.fatal
            );
        });

    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {

        // Native HLS (Safari)
        video.src = src;

    } else {

        console.error("HLS not supported in this browser");
    }
</script>

</body>
</html>
